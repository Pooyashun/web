# Base44 development environment for MelkBalad (ملک بلد).
#
# Runs the app straight from the cloned source with live reload:
#   web  -> Vite dev server (React + TypeScript)   host:3000 -> container:5173
#   api  -> Express lead endpoint (Telegram-ready) host:8000 -> container:8000
#
# Two origins are used: the browser talks to `api` through the public port 8000
# URL, which is passed to the frontend via VITE_LEAD_API_URL (see README).
services:
  api:
    image: node:22-alpine
    working_dir: /app
    command:
      ["sh", "-ec", "npm install --no-audit --no-fund && exec node --watch src/server.js"]
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - api_node_modules:/app/node_modules
      - lead_data:/app/data
    environment:
      - PORT=8000
      # Origin of the browser page, used for CORS. Same public host as the web service.
      - CLIENT_ORIGIN=https://3000-${BASE44_PUBLIC_HOST_SUFFIX}
      - LEAD_DATA_DIR=/app/data
      # Supplied by the platform; passed through so code can read it when needed.
      - BASE44_PREVIEW_MODE
    env_file:
      # Placeholders first, real platform secrets last (last wins).
      - ./.env.base44-defaults
      - /run/base44/app.env
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: on-failure

  web:
    image: node:22-alpine
    working_dir: /app
    command:
      ["sh", "-ec", "npm install --no-audit --no-fund && exec npx vite --host 0.0.0.0 --port 5173 --strictPort"]
    ports:
      - "3000:5173"
    volumes:
      - ./frontend:/app
      - web_node_modules:/app/node_modules
    environment:
      # Public URL the browser uses to reach the API on its own port.
      - VITE_LEAD_API_URL=https://8000-${BASE44_PUBLIC_HOST_SUFFIX}/api/leads
      # Set by the platform; Vite >= 6.1 appends it to server.allowedHosts so the
      # proxied preview hostname is not rejected with "Blocked request".
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      - BASE44_PREVIEW_MODE
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5173/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: on-failure

volumes:
  web_node_modules:
  api_node_modules:
  lead_data:
